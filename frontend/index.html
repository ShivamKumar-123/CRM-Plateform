<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ─── Primary SEO ──────────────────────────────────────── -->
    <title>CRM Suite — Multi-Industry Sales CRM for Indian Businesses</title>
    <meta
      name="description"
      content="Industry-agnostic multi-tenant CRM for solar, real estate, healthcare, education, manufacturing and any sales-driven business. Manage leads, deals, KYC, payments and team performance — built in India, hosted in India."
    />
    <meta
      name="keywords"
      content="CRM, sales CRM, lead management, multi-tenant CRM, Indian CRM, solar CRM, real estate CRM, healthcare CRM, deal pipeline, sales pipeline, sales tracking, lead tracking, WhatsApp CRM, automation, SaaS, India"
    />
    <meta name="author" content="Advance International Solar" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#facc15" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="CRM Suite" />
    <link rel="canonical" href="https://crm.advance-solar.in/" />

    <!-- ─── Favicons + PWA ───────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#facc15" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Suite" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ─── Open Graph (Facebook, LinkedIn, WhatsApp previews) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRM Suite" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://crm.advance-solar.in/" />
    <meta property="og:title" content="CRM Suite — Multi-Industry Sales CRM for Indian Businesses" />
    <meta
      property="og:description"
      content="Replace WhatsApp groups + Excel sheets with one clean pipeline. Multi-tenant CRM for any industry — leads, deals, KYC, payments, automation, all in ₹."
    />
    <meta property="og:image" content="https://crm.advance-solar.in/apple-touch-icon.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CRM Suite logo — yellow lightning bolt on black" />

    <!-- ─── Twitter / X cards ─────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRM Suite — Multi-Industry Sales CRM" />
    <meta
      name="twitter:description"
      content="Multi-tenant CRM for solar, real estate, healthcare, education & any sales business. Leads, deals, KYC, payments, automation."
    />
    <meta name="twitter:image" content="https://crm.advance-solar.in/apple-touch-icon.svg" />
    <meta name="twitter:image:alt" content="CRM Suite logo" />

    <!-- ─── Performance hints ─────────────────────────────────── -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="//images.pexels.com" />

            "@type": "Organization",
            "@id": "https://crm.advance-solar.in/#org",

            "url": "https://crm.advance-solar.in/",

          },
          {
            "@type": "SoftwareApplication",
            "name": "CRM Suite",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, iOS, Android",

              },

              },
              {

              }

            "aggregateRating": {
              "@type": "AggregateRating",
