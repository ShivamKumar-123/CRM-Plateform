<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background gradient: yellow → amber, matches Sidebar logo -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#facc15"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle inner ring for depth -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" ry="12.5"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Lightning bolt (Zap icon, scaled + centered) -->
  <path
    d="M37 8 L18 36 L29 36 L27 56 L46 28 L35 28 Z"
    fill="#000000"
    filter="url(#glow)"
  />
</svg>
